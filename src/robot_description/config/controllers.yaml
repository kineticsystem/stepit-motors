# Configuration file required by the Controller Manager to load the specified controls.
# See https://github.com/ros-controls/ros2_controllers/blob/master/joint_trajectory_controller/src/joint_trajectory_controller_parameters.yaml

controller_manager:
  ros__parameters:
    # Every cycle, read() asks the Teensy for the status of the motors and
    # write() sends it the commands, each waiting for the answer. The velocity
    # trajectory controller needs 100 Hz: at 30 Hz each velocity is held for
    # 33 ms and the motors stray from the trajectory. Measured on a Raspberry
    # Pi 5 with a Teensy 4.0 on 2026-11-10: a cycle takes 1.6 ms on average and
    # 2.7 ms at most over a minute at 100 Hz, with no overruns.
    update_rate: 100 # Hz

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    position_controller:
      type: position_controllers/JointGroupPositionController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    velocity_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

velocity_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

joint_trajectory_controller:
  ros__parameters:
    allow_partial_joints_goal: true

    # Start each new trajectory from the last command rather than the measured
    # state. The motors trail a move by about 50 ms, so a goal sent right after
    # another one would otherwise start from a joint still turning, and the
    # controller would carry a joint left out of the goal some 20 degrees past
    # its target and back. The hardware starts its commands as NaN, so on
    # activation the controller still starts from the measured position.
    interpolate_from_desired_state: true

    # A goal succeeds only once every joint has reached its target, not when the
    # trajectory ends: otherwise a behavior that reads the positions right after
    # a move reads them some 7 degrees short. A joint that is not within `goal`
    # radians (0.01 rad is 5 motor steps) goal_time seconds after the end fails
    # the goal. The motors plan to stop at every new target, so they trail a long
    # fast move further than a short one: the fake motor needs 0.58 s after a
    # 5-turn move at 90% of the limits to settle, 0.70 s after a 10-turn one.
    constraints:
      goal_time: 1.0
      joint1: { goal: 0.01 }
      joint2: { goal: 0.01 }
      joint3: { goal: 0.01 }
      joint4: { goal: 0.01 }
      joint5: { goal: 0.01 }
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

# The trajectory controller on the velocity interfaces, for a path that must be
# followed in time, e.g. a drawing or a camera move. Every cycle it sends each
# joint the velocity of the trajectory (the feed-forward) plus p times how far
# the joint is behind it, and the motor turns at that velocity until the next
# cycle. On the position interfaces, the motors instead run at full speed to
# each new target and plan to stop there, so they chase the trajectory: on a
# 7 s ellipse on the rig it trailed by up to 1,156 steps, this one by 3.
velocity_trajectory_controller:
  ros__parameters:
    allow_partial_joints_goal: true

    # As joint_trajectory_controller: a new goal starts from the last command.
    interpolate_from_desired_state: true

    # ff_velocity_scale and p both default to 0, which would send velocity 0.
    # p is in 1/s: an error dies away in about 1/p = 50 ms. Keep p times the
    # cycle, 0.01 s, well below 1, or the joint overshoots and oscillates. At
    # rest the joint hunts by one step, the error never reaching 0: deactivate
    # the controller when the trajectory is done.
    gains:
      joint1: { p: 20.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0 }
      joint2: { p: 20.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0 }
      joint3: { p: 20.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0 }
      joint4: { p: 20.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0 }
      joint5: { p: 20.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0 }

    constraints:
      goal_time: 1.0
      joint1: { goal: 0.01 }
      joint2: { goal: 0.01 }
      joint3: { goal: 0.01 }
      joint4: { goal: 0.01 }
      joint5: { goal: 0.01 }
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity
